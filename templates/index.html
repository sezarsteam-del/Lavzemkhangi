{% extends "base.html" %}

{% block title %}لوازم خانگی | لیست قیمت محصولات{% endblock %}

{% block head %}
<style>
    .hero {
        background: linear-gradient(120deg, #111827, #1e40af);
        color: white;
        padding: 25px 22px;
        border-radius: 18px;
        margin-bottom: 20px;
    }

    .hero-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .hero-text {
        min-width: 0;
    }

    .hero h1 {
        font-size: 22px;
        margin: 0 0 8px;
    }

    .hero p {
        color: #dbeafe;
        margin: 0;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .hero-content {
            align-items: flex-start;
            flex-direction: column;
        }
    }

    /* جستجو */
    .search {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
    }

    .search input {
        flex: 1;
        min-width: 0;
    }

    /* منوی دسته بندی */
    .category-section {
        margin: 18px 0 25px;
    }

    .category-dropdown {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(15,23,42,.04);
    }

    .category-summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px;
        cursor: pointer;
        user-select: none;
    }

    .category-summary::-webkit-details-marker {
        display: none;
    }

    .category-summary:hover {
        background: #f8fafc;
    }

    .category-summary-right {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
    }

    .main-category-icon {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        border-radius: 11px;
    }

    .main-category-icon svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: #2563eb;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .category-title {
        font-size: 14px;
        font-weight: bold;
        color: #1e293b;
    }

    .category-subtitle {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
    }

    .category-summary-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .category-total {
        font-size: 11px;
        color: #2563eb;
        background: #eff6ff;
        padding: 5px 9px;
        border-radius: 20px;
    }

    .category-chevron {
        color: #64748b;
        font-size: 19px;
        transition: transform .2s;
    }

    .category-dropdown[open] .category-chevron {
        transform: rotate(180deg);
    }

    /* کارت های دسته بندی */
    .category-content {
        border-top: 1px solid #edf0f5;
        padding: 12px;
        background: #fafcff;
    }

    .category-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .category-card {
        min-width: 0;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: white;
        border: 1px solid #e5eaf1;
        border-radius: 10px;
        text-decoration: none;
        transition: .2s;
    }

    .category-card:hover {
        border-color: #93c5fd;
        background: #f8fbff;
    }

    .category-card.selected {
        background: #eff6ff;
        border-color: #2563eb;
    }

    .category-icon {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        border-radius: 9px;
    }

    .category-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: #2563eb;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .category-name {
        font-size: 11px;
        font-weight: bold;
        color: #334155;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    .category-card.selected .category-name {
        color: #1d4ed8;
    }
