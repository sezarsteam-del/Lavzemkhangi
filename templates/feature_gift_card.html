{% extends "base.html" %}{% block title %}کارت هدیه{% endblock %}{% block content %}<h1 class="section-title">کارت هدیه</h1><form method="post" class="form-card stack-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>کد کارت هدیه</label><input name="code" maxlength="40" required placeholder="XXXX-XXXX-XXXX"><button>ثبت کد</button></form><div class="form-card"><h3>سوابق استفاده</h3>{% for h in history %}<p>{{ "{:,}".format(h.amount) }} تومان · {{ h.created_at|jalali }}</p>{% else %}<p>هنوز کارت هدیه‌ای ثبت نکرده‌اید.</p>{% endfor %}</div>{% endblock %}
