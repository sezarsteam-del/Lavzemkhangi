{% extends "base.html" %}
{% block title %}امنیت حساب{% endblock %}
{% block content %}<section class="panel account-panel"><h1>تغییر رمز عبور</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>رمز فعلی</label><input type="password" name="current_password" required autocomplete="current-password"><label>رمز جدید (حداقل ۱۰ نویسه)</label><input type="password" name="new_password" minlength="10" maxlength="128" required autocomplete="new-password"><label>تکرار رمز جدید</label><input type="password" name="confirm_password" minlength="10" maxlength="128" required autocomplete="new-password"><button type="submit">تغییر رمز</button></form></section>{% endblock %}
