{% extends "base.html" %}
{% block title %}تعیین رمز جدید{% endblock %}
{% block content %}<section class="panel account-panel"><h1>تعیین رمز عبور جدید</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>کد پیامک‌شده</label><input name="code" inputmode="numeric" maxlength="6" required><label>رمز جدید (حداقل ۱۰ نویسه)</label><input type="password" name="new_password" minlength="10" maxlength="128" required autocomplete="new-password"><label>تکرار رمز جدید</label><input type="password" name="confirm_password" minlength="10" maxlength="128" required autocomplete="new-password"><button type="submit">ثبت رمز جدید</button></form></section>{% endblock %}
