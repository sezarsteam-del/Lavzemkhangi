{% extends "base.html" %}{% block title %}اعلان‌های من{% endblock %}{% block head %}<style>.notices{max-width:900px;margin:24px auto}.notice{padding:15px;margin:12px 0;border:1px solid #705b37;border-radius:12px;background:#211f24;color:#eee}.notice form{display:inline}.notice button{padding:7px 12px;border:0;border-radius:7px;background:#9b753b;color:#fff}.notice-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}</style>{% endblock %}{% block content %}<main class="notices"><div class="notice-head"><h2>اعلان‌های من</h2><form method="post" action="{{ url_for('extras.notifications_clear') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit" onclick="return confirm('تمام اعلان‌ها حذف شوند؟')">پاک‌کردن همه اعلان‌ها</button></form></div>{% for n in notifications %}<article class="notice"><strong>{{ n.title }}</strong><p>{{ n.body }}</p><small>{{ n.created_at|jalali }}</small><form method="post" action="{{ url_for('extras.notification_delete',notification_id=n.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit">حذف اعلان</button></form></article>{% else %}<p>اعلان جدیدی ندارید.</p>{% endfor %}</main>{% endblock %}
