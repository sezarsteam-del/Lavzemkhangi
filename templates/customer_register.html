{% extends "base.html" %}
{% block head %}<style>.account-panel{max-width:760px;margin:24px auto;padding:22px;background:#fff;border:1px solid #e5eaf1;border-radius:16px}.account-panel h1{margin-top:0}.account-panel label{display:block;margin:14px 0 6px}.account-panel input,.account-panel select,.account-panel textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dbe2ec;border-radius:9px;font:inherit}.account-panel button,.account-panel .button{display:inline-block;margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#2563eb;color:white;text-decoration:none;font:inherit;cursor:pointer}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #edf0f5}.cart-row img{width:75px;height:75px;object-fit:contain}.cart-row input{max-width:90px}.account-panel table{width:100%;border-collapse:collapse}.account-panel td,.account-panel th{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}@media(max-width:600px){.account-panel{padding:15px}.cart-row{flex-wrap:wrap}}</style>{% endblock %}
{% block title %}ثبت‌نام مشتری{% endblock %}{% block content %}<section class="panel account-panel"><h1>ساخت حساب مشتری</h1><p>برای خرید و پیگیری سفارش‌ها حساب بسازید.</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>نام</label><input name="first_name" required maxlength="80"><label>نام خانوادگی</label><input name="last_name" required maxlength="80"><label>شماره موبایل</label><input name="phone" required inputmode="tel" placeholder="09123456789"><label>رمز عبور (حداقل ۱۰ کاراکتر)</label><input type="password" name="password" required minlength="10" maxlength="128"><button type="submit">ثبت‌نام</button></form><p><a href="{{ url_for('customer.customer_login') }}">ورود به حساب</a></p></section>{% endblock %}
